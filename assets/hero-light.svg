    <text x="0" y="310.5" opacity="0.9" xml:space="preserve">    :s##scc`==+c*+++++=cs##+=--+*c+*c#``=%s=*=</text>
    <text x="0" y="324.0" opacity="0.9" xml:space="preserve">   .*##sc*%=-==**=+++==*s%#*=--=*s**c#``=#ssss</text>
    <rect x="0" y="345" width="8" height="14" fill="#2563EB">
