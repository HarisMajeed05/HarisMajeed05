    <text x="0" y="229.5" opacity="0.9" xml:space="preserve">       :c%%**+++-+c=+-#%*==#-:=**c**sc.:*ss*#s</text>
    <text x="0" y="243.0" opacity="0.9" xml:space="preserve">      .+#%c====+=+*++=c%sc##::+*+c++cs``+s#++c</text>
