name: metrics

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: HarisMajeed05
          committer_message: "chore: refresh contribution calendar"
          committer_branch: main
          filename: assets/metrics.dark.svg
          config_timezone: Asia/Karachi
          plugin_calendar: yes
          plugin_calendar_limit: 1
          base: header, activity
          config_display: large
          config_theme: github-dark

      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: HarisMajeed05
          committer_message: "chore: refresh contribution calendar"
          committer_branch: main
          filename: assets/metrics.light.svg
          config_timezone: Asia/Karachi
          plugin_calendar: yes
          plugin_calendar_limit: 1
          base: header, activity
          config_display: large
          config_theme: classic
