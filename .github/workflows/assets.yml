name: refresh assets

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "assets/skills.json"
      - "assets/projects.json"
      - "scripts/generate_assets.py"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: generate radar, stat card, and project cards
        env:
          GH_LOGIN: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_assets.py

      - name: commit changes if any
        run: |
          FILES="assets/radar-dark.svg assets/radar-light.svg assets/radar-langs-dark.svg assets/radar-langs-light.svg assets/stat-card-dark.svg assets/stat-card-light.svg assets/card-*.svg"
          [ -z "$(git status --porcelain -- $FILES)" ] && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $FILES
          git commit -m "chore: refresh radar, stats, and project cards"
          git push
